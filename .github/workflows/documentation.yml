name: Documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install virtual display for GLMakie
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Install documentation dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: julia --color=yes --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build documentation for pull requests
        if: github.event_name == 'pull_request'
        run: xvfb-run -a julia --color=yes --project=docs docs/make.jl
      - name: Build and deploy documentation
        if: github.event_name != 'pull_request'
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: xvfb-run -a julia --color=yes --project=docs docs/make.jl --deploy
